name: Build Ma Vie Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/ch/sergezehntner/mavie
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/values android/app/src/main/res/drawable

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > android/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MaVieBridge"
          include(":app")
          EOF

          cat > android/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "ch.sergezehntner.mavie"

              compileOptions {
                 sourceCompatibility = JavaVersion.VERSION_17
                 targetCompatibility = JavaVersion.VERSION_17
              }

              compileSdk = 35
              defaultConfig {
                  applicationId = "ch.sergezehntner.mavie"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 28
                  versionName = "0.1.028"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
          }
          EOF

          cp icon-512.png android/app/src/main/res/drawable/ic_launcher.png

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_CALENDAR"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <application android:label="Ma Vie" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:usesCleartextTraffic="false" android:theme="@style/Theme.MaVie">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webView"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.MaVie" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">#DCEFF1</item>
                  <item name="android:statusBarColor">#DCEFF1</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/java/ch/sergezehntner/mavie/CalendarBridge.kt <<'EOF'
          package ch.sergezehntner.mavie
          import android.content.Context
          import android.provider.CalendarContract
          import android.location.LocationManager
          import android.content.pm.PackageManager
          import androidx.core.content.ContextCompat
          import android.webkit.JavascriptInterface
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Calendar

          class CalendarBridge(private val context: Context) {
              @JavascriptInterface
              fun getLocation(): String {
                  val fine = ContextCompat.checkSelfPermission(context, android.Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  val coarse = ContextCompat.checkSelfPermission(context, android.Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  if (!fine && !coarse) return ""
                  val lm = context.getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  val best = lm.getProviders(true).mapNotNull { provider ->
                      try { lm.getLastKnownLocation(provider) } catch (_: SecurityException) { null }
                  }.maxByOrNull { it.time } ?: return ""
                  return JSONObject().apply {
                      put("latitude", best.latitude)
                      put("longitude", best.longitude)
                      put("accuracy", best.accuracy)
                      put("time", best.time)
                  }.toString()
              }

              @JavascriptInterface
              fun getEvents(): String {
                  val now = System.currentTimeMillis()
                  val cal = Calendar.getInstance().apply {
                      timeInMillis = now
                      add(Calendar.DAY_OF_YEAR, 2)
                      set(Calendar.HOUR_OF_DAY, 23)
                      set(Calendar.MINUTE, 59)
                  }
                  val uri = CalendarContract.Instances.CONTENT_URI.buildUpon().also {
                      android.content.ContentUris.appendId(it, now)
                      android.content.ContentUris.appendId(it, cal.timeInMillis)
                  }.build()
                  val p = arrayOf(
                      CalendarContract.Instances.EVENT_ID, CalendarContract.Instances.TITLE,
                      CalendarContract.Instances.BEGIN, CalendarContract.Instances.END,
                      CalendarContract.Instances.EVENT_LOCATION, CalendarContract.Instances.CALENDAR_ID,
                      CalendarContract.Instances.CALENDAR_DISPLAY_NAME, CalendarContract.Instances.ALL_DAY
                  )
                  val out = JSONArray()
                  context.contentResolver.query(uri,p,null,null,CalendarContract.Instances.BEGIN+" ASC")?.use { c ->
                      while(c.moveToNext()) out.put(JSONObject().apply {
                          put("id",c.getLong(0)); put("title",c.getString(1)?:"")
                          put("start",c.getLong(2)); put("end",c.getLong(3))
                          put("place",c.getString(4)?:""); put("calendarId",c.getLong(5))
                          put("calendar",c.getString(6)?:""); put("allDay",c.getInt(7)==1)
                      })
                  }
                  return out.toString()
              }
          }
          EOF

          cat > android/app/src/main/java/ch/sergezehntner/mavie/MainActivity.kt <<'EOF'
          package ch.sergezehntner.mavie
          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private val host="sergezehntner-ux.github.io"
              private val startUrl="https://sergezehntner-ux.github.io/Ma_Vie/"
              private val askPermissions=registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()){ webView.reload() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  webView=findViewById(R.id.webView)
                  webView.settings.javaScriptEnabled=true
                  webView.settings.domStorageEnabled=true
                  webView.addJavascriptInterface(CalendarBridge(this),"MaVieAndroid")
                  webView.webViewClient=object:WebViewClient(){
                      override fun shouldOverrideUrlLoading(v:WebView,r:WebResourceRequest):Boolean {
                          val u=r.url
                          return if(u.scheme=="https" && u.host==host) false
                          else { startActivity(Intent(Intent.ACTION_VIEW,u)); true }
                      }
                  }
                  val missing=mutableListOf<String>()
                  if(ContextCompat.checkSelfPermission(this,Manifest.permission.READ_CALENDAR)!=PackageManager.PERMISSION_GRANTED) missing.add(Manifest.permission.READ_CALENDAR)
                  if(ContextCompat.checkSelfPermission(this,Manifest.permission.ACCESS_COARSE_LOCATION)!=PackageManager.PERMISSION_GRANTED) missing.add(Manifest.permission.ACCESS_COARSE_LOCATION)
                  if(ContextCompat.checkSelfPermission(this,Manifest.permission.ACCESS_FINE_LOCATION)!=PackageManager.PERMISSION_GRANTED) missing.add(Manifest.permission.ACCESS_FINE_LOCATION)
                  if(missing.isNotEmpty()) askPermissions.launch(missing.toTypedArray())
                  webView.loadUrl(startUrl)
              }
          }
          EOF

      - name: Build APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ma_Vie_Android_v0.1.028
          path: android/app/build/outputs/apk/debug/app-debug.apk
