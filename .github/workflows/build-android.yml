name: Build Ma Vie Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/ch/sergezehntner/mavie
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/values android/app/src/main/res/drawable android/app/src/main/res/drawable-nodpi android/app/src/main/res/xml

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > android/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MaVieBridge"
          include(":app")
          EOF

          cat > android/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "ch.sergezehntner.mavie"
              compileOptions {
                 sourceCompatibility = JavaVersion.VERSION_17
                 targetCompatibility = JavaVersion.VERSION_17
              }
              compileSdk = 35
              defaultConfig {
                  applicationId = "ch.sergezehntner.mavie"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 218
                  versionName = "0.3.0.9"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("../mavie-release.jks")
                      storePassword = System.getenv("MAVIE_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("MAVIE_KEY_ALIAS")
                      keyPassword = System.getenv("MAVIE_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
          }
          EOF

          cp icon-512.png android/app/src/main/res/drawable/ic_launcher.png
          cp widget-ursy-green.jpg android/app/src/main/res/drawable-nodpi/widget_ursy_green.jpg
          cp widget-ursy-snow.jpg android/app/src/main/res/drawable-nodpi/widget_ursy_snow.jpg

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_CALENDAR"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <queries>
                  <package android:name="cz.skodaauto.myskoda"/>
              </queries>
              <application android:label="Ma Vie" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:usesCleartextTraffic="false" android:theme="@style/Theme.MaVie">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".MaVieWidgetProvider" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                          <action android:name="android.intent.action.USER_PRESENT"/>
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/ma_vie_widget_info"/>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/layout/activity_main.xml <<'EOF'
