          class MaVieWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) = refresh(context,0)
              override fun onEnabled(context: Context) = refresh(context,0)
              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context,intent)
                  if(intent.action==Intent.ACTION_USER_PRESENT) refresh(context,0)
                  if(intent.action==ACTION_RETRY) refresh(context,intent.getIntExtra("attempt",1))
              }

              companion object {
                  private const val ACTION_RETRY="ch.sergezehntner.mavie.WIDGET_RETRY"
                  fun refresh(context: Context, attempt:Int=0) {
                      thread {
                          try {
                              val complete=update(context)
                              if(!complete && attempt<3) scheduleRetry(context,attempt+1)
                          } catch (_: Exception) { if(attempt<3) scheduleRetry(context,attempt+1) }
                      }
                  }

                  private fun scheduleRetry(context:Context,attempt:Int){
                      val delay=when(attempt){1->5_000L;2->20_000L;else->60_000L}
                      val i=Intent(context,MaVieWidgetProvider::class.java).setAction(ACTION_RETRY).putExtra("attempt",attempt)
                      val pi=PendingIntent.getBroadcast(context,200+attempt,i,PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val alarm=context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      alarm.set(AlarmManager.ELAPSED_REALTIME_WAKEUP,android.os.SystemClock.elapsedRealtime()+delay,pi)
                  }

                  private fun update(context: Context):Boolean {
                      val mgr=AppWidgetManager.getInstance(context)
                      val ids=mgr.getAppWidgetIds(ComponentName(context,MaVieWidgetProvider::class.java)); if(ids.isEmpty()) return true
                      val v=RemoteViews(context.packageName,R.layout.ma_vie_widget)
                      val liveLocation=lastLocation(context)
                      val prefs=context.getSharedPreferences("ma_vie_widget",Context.MODE_PRIVATE)
                      if(liveLocation.first!=null && liveLocation.second!=null){
                          prefs.edit().putLong("last_lat",java.lang.Double.doubleToRawLongBits(liveLocation.first!!)).putLong("last_lon",java.lang.Double.doubleToRawLongBits(liveLocation.second!!)).apply()
                      }
                      val lat=liveLocation.first ?: if(prefs.contains("last_lat")) java.lang.Double.longBitsToDouble(prefs.getLong("last_lat",0L)) else null
                      val lon=liveLocation.second ?: if(prefs.contains("last_lon")) java.lang.Double.longBitsToDouble(prefs.getLong("last_lon",0L)) else null
                      val weather=weather(lat,lon)
                      val placeName=place(context,lat,lon)
                      if(placeName!="Ma Vie") prefs.edit().putString("last_place",placeName).apply()
                      val shownPlace=if(placeName=="Ma Vie") prefs.getString("last_place","Ma Vie") ?: "Ma Vie" else placeName
                      v.setTextViewText(R.id.widget_place,shownPlace)
                      v.setTextViewText(R.id.widget_temp,weather.first)
                      v.setImageViewBitmap(R.id.weather_background,sceneBitmap(context,weather.second,shownPlace,lat,lon))
                      val ev=events(context)
                      v.setTextViewText(R.id.widget_now,ev.first)
                      v.setTextViewText(R.id.widget_know,ev.second)
                      val libre=try{JSONObject(LibreBridge(context,null).getData())}catch(_:Exception){null}
                      v.setTextViewText(R.id.widget_glucose, if(libre?.optBoolean("ok")==true) "🩸 %.1f mmol/L %s".format(Locale.US,libre.optDouble("mmol"),libre.optString("arrow")) else "🩸 Glycémie —")
                      val enyaq=try{JSONObject(EnyaqBridge(context,null).getData())}catch(_:Exception){null}
                      v.setTextViewText(R.id.widget_enyaq,if(enyaq?.optBoolean("ok")==true) "🚙 %.0f %% · %.0f km".format(Locale.US,enyaq.optDouble("percent"),enyaq.optDouble("km")) else "🚙 Enyaq —")
                      val app=PendingIntent.getActivity(context,10,Intent(context,MainActivity::class.java),PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      v.setOnClickPendingIntent(R.id.widget_root,app)
                      val calUri=CalendarContract.CONTENT_URI.buildUpon().appendPath("time").appendPath(System.currentTimeMillis().toString()).build()
                      val cal=PendingIntent.getActivity(context,11,Intent(Intent.ACTION_VIEW,calUri),PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      v.setOnClickPendingIntent(R.id.card_now,cal)
                      ids.forEach{mgr.updateAppWidget(it,v)}
                      val weatherOk=weather.first!="--°"
                      val libreOk=libre?.optBoolean("ok")==true
                      val enyaqOk=enyaq?.optBoolean("ok")==true
                      return weatherOk && libreOk && enyaqOk
                  }

                  private fun lastLocation(c:Context):Pair<Double?,Double?> { return try{
                      val lm=c.getSystemService(Context.LOCATION_SERVICE) as LocationManager
                      val l=lm.getProviders(true).mapNotNull{try{lm.getLastKnownLocation(it)}catch(_:SecurityException){null}}.maxByOrNull{it.time}
                      Pair(l?.latitude,l?.longitude)
                  }catch(_:Exception){Pair(null,null)} }

                  private fun place(c:Context,lat:Double?,lon:Double?):String { if(lat==null||lon==null)return "Ma Vie"; return try{
                      @Suppress("DEPRECATION") val a=Geocoder(c,Locale.getDefault()).getFromLocation(lat,lon,1)?.firstOrNull()
                      a?.locality ?: a?.subLocality ?: a?.adminArea ?: "Ma Vie"
                  }catch(_:Exception){"Ma Vie"} }

                  private fun weather(lat:Double?,lon:Double?):Pair<String,Int>{ if(lat==null||lon==null)return Pair("--°",0); return try{
                      val raw=URL("https://api.open-meteo.com/v1/forecast?latitude=$lat&longitude=$lon&current=temperature_2m,weather_code,is_day&timezone=auto").readText()
                      val o=JSONObject(raw).getJSONObject("current"); Pair("%.0f°".format(o.getDouble("temperature_2m")),o.getInt("weather_code")+(if(o.optInt("is_day",1)==0)1000 else 0))
                  }catch(_:Exception){Pair("--°",0)} }

                  private fun distanceKm(aLat:Double,aLon:Double,bLat:Double,bLon:Double):Double{
                      val r=6371.0
                      val dLat=Math.toRadians(bLat-aLat); val dLon=Math.toRadians(bLon-aLon)
                      val x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(Math.toRadians(aLat))*Math.cos(Math.toRadians(bLat))*Math.sin(dLon/2)*Math.sin(dLon/2)
                      return 2*r*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))
                  }

                  private fun sceneBitmap(context:Context,code:Int,placeName:String,lat:Double?,lon:Double?):Bitmap{
                      val w=1200; val h=700; val b=Bitmap.createBitmap(w,h,Bitmap.Config.ARGB_8888); val c=Canvas(b)
                      val night=code>=1000; val wc=code%1000
                      // Prefer the actual coordinates: reverse geocoding can be unavailable when a widget
                      // is first added.  The 3.5 km fallback covers the Ursy home area without turning
                      // every nearby trip into the home photograph.
                      val nearUrsy=lat!=null && lon!=null && distanceKm(lat,lon,46.634729,6.834161)<=3.5
                      val isUrsy=placeName.equals("Ursy",ignoreCase=true) || nearUrsy
                      val snowy=wc in 71..77 || wc in 85..86
                      val photo=if(isUrsy) BitmapFactory.decodeResource(context.resources,if(snowy)R.drawable.widget_ursy_snow else R.drawable.widget_ursy_green) else null
                      if(photo!=null){
                          val scale=maxOf(w.toFloat()/photo.width,h.toFloat()/photo.height)
                          val dw=photo.width*scale; val dh=photo.height*scale
                          val dst=RectF(w-dw,(h-dh)/2f,w.toFloat(),(h+dh)/2f)
                          c.drawBitmap(photo,null,dst,Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG))
                          c.drawRect(0f,0f,w.toFloat(),h.toFloat(),Paint().apply{color=Color.argb(if(night)145 else 28,0,28,48)})
                      } else {
                          val top=if(night)Color.rgb(5,44,69) else Color.rgb(54,150,218); val bot=if(night)Color.rgb(8,91,111) else Color.rgb(174,218,239)
                          c.drawRect(0f,0f,w.toFloat(),h.toFloat(),Paint().apply{shader=LinearGradient(0f,0f,0f,h.toFloat(),top,bot,Shader.TileMode.CLAMP)})
                      }
                      val p=Paint(Paint.ANTI_ALIAS_FLAG)

                      // Weather is atmospheric, not a set of geometric stickers.
                      // Soft radial gradients let the light/clouds blend into the real photograph.
                      fun glow(cx:Float,cy:Float,r:Float,inner:Int,outer:Int){
                          p.shader=RadialGradient(cx,cy,r,inner,outer,Shader.TileMode.CLAMP)
                          c.drawCircle(cx,cy,r,p); p.shader=null
                      }
                      fun softOval(cx:Float,cy:Float,rx:Float,ry:Float,alpha:Int){
                          c.save(); c.scale(1f,ry/rx,cx,cy)
                          p.shader=RadialGradient(cx,cy,rx,Color.argb(alpha,246,249,252),Color.argb(0,246,249,252),Shader.TileMode.CLAMP)
                          c.drawCircle(cx,cy,rx,p); p.shader=null; c.restore()
                      }
                      fun cloud(cx:Float,cy:Float,scale:Float,alpha:Int){
                          // diffuse base + irregular lobes; deliberately asymmetric
                          softOval(cx,cy+18f*scale,150f*scale,48f*scale,alpha*2/3)
                          softOval(cx-82f*scale,cy+5f*scale,76f*scale,45f*scale,alpha*3/4)
                          softOval(cx-28f*scale,cy-24f*scale,94f*scale,63f*scale,alpha)
                          softOval(cx+48f*scale,cy-38f*scale,108f*scale,72f*scale,alpha)
                          softOval(cx+112f*scale,cy+2f*scale,82f*scale,50f*scale,alpha*4/5)
                          softOval(cx+35f*scale,cy+12f*scale,135f*scale,55f*scale,alpha*3/4)
                      }

                      if(night){
                          glow(820f,115f,105f,Color.argb(120,255,240,175),Color.TRANSPARENT)
                          p.color=Color.rgb(255,239,170); c.drawCircle(820f,115f,48f,p)
                          p.color=Color.argb(245,7,43,66); c.drawCircle(842f,96f,50f,p)
                          p.color=Color.argb(225,255,255,255); for(i in 0..18)c.drawCircle(((i*173)%w).toFloat(),(70+(i*97)%360).toFloat(),if(i%4==0)3.5f else 2.2f,p)
                      } else {
                          glow(850f,110f,150f,Color.argb(105,255,224,110),Color.TRANSPARENT)
                          glow(850f,110f,78f,Color.argb(235,255,224,95),Color.argb(0,255,224,95))
                          p.color=Color.argb(235,255,220,82); c.drawCircle(850f,110f,42f,p)
                      }

                      if(wc in 1..3 || wc in 45..48 || wc>=51){
                          val a=if(wc>=51 || wc in 45..48)185 else 145
                          when(wc){
                              1 -> cloud(405f,185f,0.78f,a)
                              2 -> { cloud(350f,180f,0.88f,a); cloud(700f,205f,0.68f,a-20) }
                              else -> { cloud(285f,175f,0.92f,a); cloud(650f,190f,0.86f,a); cloud(930f,220f,0.62f,a-25) }
                          }
                          if(wc in 45..48){
                              p.shader=LinearGradient(0f,210f,0f,500f,Color.argb(75,235,242,245),Color.argb(0,235,242,245),Shader.TileMode.CLAMP)
                              c.drawRect(0f,210f,w.toFloat(),520f,p); p.shader=null
                          }
                      }
                      if(wc>=51 && wc !in 71..77 && wc !in 85..86){
                          p.color=Color.argb(135,205,230,245);p.strokeWidth=3f
                          for(x in 150..1080 step 105)c.drawLine(x.toFloat(),300f,(x-18).toFloat(),350f,p)
                      }
                      if(snowy){p.color=Color.argb(210,255,255,255); for(i in 0..28){val x=((i*149)%w).toFloat(); val y=(80+(i*83)%420).toFloat(); c.drawCircle(x,y,if(i%3==0)5f else 3.2f,p)}}
                      return b
                  }

                  private fun events(c:Context):Pair<String,String>{
                      val now=System.currentTimeMillis()
                      val todayStart=Calendar.getInstance().apply{set(Calendar.HOUR_OF_DAY,0);set(Calendar.MINUTE,0);set(Calendar.SECOND,0);set(Calendar.MILLISECOND,0)}.timeInMillis
                      val tomorrowStart=Calendar.getInstance().apply{timeInMillis=todayStart;add(Calendar.DAY_OF_YEAR,1)}.timeInMillis
                      val end=tomorrowStart-1
                      val uri=CalendarContract.Instances.CONTENT_URI.buildUpon().also{android.content.ContentUris.appendId(it,todayStart);android.content.ContentUris.appendId(it,end)}.build()
                      val p=arrayOf(CalendarContract.Instances.TITLE,CalendarContract.Instances.BEGIN,CalendarContract.Instances.END,CalendarContract.Instances.EVENT_LOCATION,CalendarContract.Instances.ALL_DAY)
                      val timed=mutableListOf<String>(); val periods=mutableListOf<String>(); val events=mutableListOf<String>(); val important=mutableListOf<String>(); val tf=SimpleDateFormat("HH:mm",Locale.getDefault())
                      try{c.contentResolver.query(uri,p,null,null,CalendarContract.Instances.BEGIN+" ASC")?.use{q->while(q.moveToNext()){
                          val title=q.getString(0)?:""; val start=q.getLong(1); val stop=q.getLong(2); val loc=q.getString(3)?:""; val all=q.getInt(4)==1
                          if(all){
                              // CalendarProvider stores ALL_DAY BEGIN/END at UTC midnight.  Do not compare
                              // those instants with local-midnight milliseconds: around UTC+02 this makes
                              // yesterday leak into today and shifts the day number of multi-day periods.
                              val zone=java.time.ZoneId.systemDefault()
                              val today=java.time.LocalDate.now(zone)
                              val startDate=java.time.Instant.ofEpochMilli(start).atZone(java.time.ZoneOffset.UTC).toLocalDate()
                              val endDateExclusive=java.time.Instant.ofEpochMilli(stop).atZone(java.time.ZoneOffset.UTC).toLocalDate()
                              if(!today.isBefore(startDate) && today.isBefore(endDateExclusive)){
                                  val days=java.time.temporal.ChronoUnit.DAYS.between(startDate,endDateExclusive).toInt().coerceAtLeast(1)
                                  val birthday=Regex("anniversaire|birthday",RegexOption.IGNORE_CASE).containsMatchIn(title)
                                  if(days>1){
                                      val day=(java.time.temporal.ChronoUnit.DAYS.between(startDate,today).toInt()+1).coerceIn(1,days)
                                      periods.add("🏖️ "+title+" (jour $day/$days)")
                                  } else if(birthday) important.add("🎂 "+title)
                                  else events.add("• "+title)
                              }
                          }
                          else if(stop>=now && start<=end){ if(timed.size<4) timed.add(tf.format(Date(start))+"  "+title+(if(loc.isNotBlank())"\n     "+loc else "")) }
                      }}}catch(_:Exception){}
                      val know=(periods+events+important).take(3)
                      return Pair(if(timed.isEmpty())"Plus de rendez-vous prévu aujourd’hui." else timed.joinToString("\n"),if(know.isEmpty())"Rien de particulier aujourd’hui." else know.joinToString("\n"))
                  }
              }
          }
