<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087d89">
<title>Ma Vie — le guide de mes journées</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="fixes-v026.css"><link rel="stylesheet" href="layout-v026c.css"><link rel="stylesheet" href="layout-v026d.css"><link rel="stylesheet" href="layout-v026e.css"><link rel="stylesheet" href="layout-v026f.css"><link rel="stylesheet" href="layout-v031.css">
</head>
<body data-period="day" data-weather="sun">
<div class="weather-scene" aria-hidden="true"><div class="celestial"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div><div class="rain"></div><div class="horizon"></div></div>
<main class="app-shell">
<header class="topbar">
  <div class="identity"><img class="app-logo" src="icon-192.png" alt=""><div><div class="brand">Guide quotidien</div><div class="tagline">Le guide de mes journées</div><div class="version">v0.3.2 · À savoir</div></div></div>
  <div class="day-weather-wrap"><div id="todayLabel" class="day-weather"></div><div class="weather-location"><span id="weatherPlace"></span><span class="weather-sep">&nbsp;·&nbsp;</span><span id="weatherTemp">—</span></div></div>
</header>
<section class="grid">
  <article class="card now-card"><div class="card-title">MAINTENANT <span class="source">Agenda</span></div><div id="nowAppointments"></div><div id="tasks" class="tasks"></div></article>
  <article class="card tomorrow-card">
    <div class="card-title tomorrow-heading"><span>DEMAIN</span><span id="tomorrowWeatherHead" class="tomorrow-weather-head">🌤️ 16–21°</span><span class="source">Agenda</span></div>
    <div id="tomorrowAppointments"></div><div id="tomorrowWarning"></div>
  </article>
  <article class="card guide-card"><div class="card-title">À SAVOIR</div><div id="guideItems"></div></article>
</section>
<div class="demo-panel hidden" aria-hidden="true"><summary>Démo</summary><div class="demo-controls"><button id="demoWeather"></button><button id="demoPeriod"></button><label><input id="autoAmbience" type="checkbox" checked></label></div></div>
<div class="permanent-dock">
  <article class="personal-card"><div class="card-title">POUR MOI</div><div class="metrics">
   <div class="metric"><span>🩸</span><div><small>Glycémie</small><strong>—</strong></div></div>
   <div class="metric"><span>🚙</span><div><small>Enyaq</small><strong>—</strong></div></div>
   <div class="metric"><span>🏠</span><div><small>Maison</small><strong>OK</strong></div></div>
  </div></article>
  <nav class="quickbar"><div class="quickbar-title">MES APPS</div><div class="quickbar-links">
   <button data-companion="https://sergezehntner-ux.github.io/Herbier_gourmand/"><img src="icon-herbier.png" alt=""><span>Herbier</span></button>
   <button data-companion="https://sergezehntner-ux.github.io/ma_sante/"><img src="icon-sante.png" alt=""><span>Ma Santé</span></button>
   <button data-companion="https://sergezehntner-ux.github.io/Djinn/"><img src="icon-djinn.png" alt=""><span>Djinn</span></button>
  </div></nav>
</div>
</main>
<script src="compat-v026b.js"></script><script src="app.js"></script><script src="enyaq.js"></script><script src="libre.js"></script><script src="a-savoir-v032.js"></script><script src="density-v031.js"></script>
<script>document.querySelector('.version').textContent='v0.3.2 · À savoir';</script>
</body></html>
