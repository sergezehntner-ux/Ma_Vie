<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e7484">
  <title>Ma Vie</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-weather="sun" data-period="evening">
  <div class="weather-scene" aria-hidden="true"><div class="celestial"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div><div class="rain"></div><div class="horizon"></div></div>
  <main class="app-shell">
    <header class="topbar">
      <div class="identity"><img class="app-logo" src="icon-192.png" alt=""><div><div class="brand">Guide quotidien</div><div class="tagline">Le guide de mes journées</div><div class="version">v0.2.4 · Connexions</div></div></div>
      <div class="day-weather-wrap"><strong id="todayLabel"></strong><div class="weather-location"><span id="weatherPlace"></span><span class="weather-sep" aria-hidden="true"> · </span><span id="temperatureLabel"></span></div></div>
    </header>

    <section class="grid">
      <article class="card now-card"><div class="card-title"><span>Maintenant</span><span class="source">Agenda</span></div><div id="todayAppointments"></div><p class="empty-state hidden" id="todayEmpty">✓ Plus de rendez-vous prévu aujourd'hui.</p></article>
      <article class="card tomorrow-card"><div class="card-title"><span>Demain</span><span class="source">Aperçu</span></div><div id="tomorrowAppointments" class="tomorrow-list"></div><div class="empty-state hidden" id="tomorrowEmpty"><strong>Demain, aucun rendez-vous n'est prévu.</strong><div class="choice-row"><button data-suggestion="discovery">🌿 Envie d'une découverte ?</button><button data-suggestion="djinn">🧞 Envie de faire un peu de ménage ?</button></div></div></article>
      <article class="card personal-card"><div class="card-title"><span>Pour moi</span><button class="icon-btn" id="personalize" title="Personnaliser">⚙️</button></div><div class="metrics"><button class="metric"><span>🩸</span><span><small>Glycémie</small><strong>6.4 mmol/L →</strong></span></button><button class="metric"><span>🚗</span><span><small>Enyaq</small><strong>—</strong></span></button><button class="metric"><span>☀️</span><span><small>Demain</small><strong>16–21°</strong></span></button><button class="metric"><span>🏠</span><span><small>Maison</small><strong>OK</strong></span></button></div></article>
      <article class="card guide-card"><div class="card-title"><span>À savoir</span><span class="source">Guide</span></div></article>
    </section>
    <nav class="quickbar" aria-label="Compagnons"><button type="button" data-companion="https://sergezehntner-ux.github.io/Herbier_gourmand/"><img src="icon-herbier.png" alt=""><span>Herbier</span></button><button type="button" data-companion="https://sergezehntner-ux.github.io/ma_sante/"><img src="icon-sante.png" alt=""><span>Ma Santé</span></button><button type="button" data-companion="https://sergezehntner-ux.github.io/Djinn/"><img src="icon-djinn.png" alt=""><span>Djinn</span></button></nav>

    <!-- Compatibilité temporaire avec app.js : contrôles présents mais totalement invisibles. -->
    <div hidden aria-hidden="true">
      <details class="demo-panel"><summary></summary></details>
      <select id="demoWeather"><option value="sun">sun</option><option value="cloud">cloud</option><option value="rain">rain</option><option value="storm">storm</option><option value="snow">snow</option><option value="fog">fog</option></select>
      <select id="demoPeriod"><option value="dawn">dawn</option><option value="day">day</option><option value="evening">evening</option><option value="night">night</option></select>
      <button id="autoAmbience"></button>
    </div>
  </main>
  <dialog id="dialog"><form method="dialog"><h2 id="dialogTitle">Ma Vie</h2><p id="dialogText"></p><button>Fermer</button></form></dialog>
  <script src="app.js"></script>
  <script src="enyaq.js"></script>
  <script>
    // app.js v0.2.2 impose encore son ancien libellé ; remettre immédiatement le libellé courant.
    document.querySelector('.version').textContent='v0.2.4 · Connexions';
  </script>
</body></html>
